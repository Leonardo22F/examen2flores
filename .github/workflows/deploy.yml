name: CI/CD + Deploy

on:
  push:
    branches: ["almachi"]
  workflow_dispatch:

env:
  IMAGE_VERSION: "1.0.5"
  APP_NAME: "almachi"
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/almachi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

  build_and_push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_VERSION }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - uses: actions/checkout@v4

      - name: Copy stack.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_USER }}/deploy/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script: |
            set -e
            export GH_OWNER=${{ github.repository_owner }}
            export IMAGE_VERSION=${{ env.IMAGE_VERSION }}

            echo "Logging in to GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${GH_OWNER}" --password-stdin

            echo "Pulling image ${GH_OWNER}/almachi:${IMAGE_VERSION}"
            docker pull ghcr.io/${GH_OWNER}/almachi:${IMAGE_VERSION}

            mkdir -p /home/${{ secrets.VPS_USER }}/deploy

            echo "Deploying stack ${{ secrets.STACK_NAME }} with image version ${IMAGE_VERSION}"
            IMAGE_VERSION=${IMAGE_VERSION} GH_OWNER=${GH_OWNER} docker stack deploy \
              -c /home/${{ secrets.VPS_USER }}/deploy/stack.yml \
              ${{ secrets.STACK_NAME }}

            docker stack services ${{ secrets.STACK_NAME }}
